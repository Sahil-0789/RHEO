# ─────────────────────────────────────────────────────────────────
# RHEO — Nginx Production Configuration (AWS EC2)
#
# Supports:
# 1. SSL / HTTPS termination via Certbot (Let's Encrypt).
# 2. WebSocket Upgrade headers (`Upgrade: $http_upgrade`, `Connection: "Upgrade"`).
# 3. HTTP → HTTPS auto-redirect.
# 4. Unbuffered binary chunk streaming for low latency.
# ─────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 8192;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream rheo_backend {
        server server:5000;
        keepalive 64;
    }

    # ── HTTP Server (Redirect to HTTPS & Certbot Challenge) ──────
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge directory
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint on HTTP (for AWS ALB or health checkers)
        location /health {
            proxy_pass http://rheo_backend;
            proxy_http_version 1.1;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # SSL Certificates (Managed by Certbot)
        ssl_certificate     /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 20M;

        # Health check
        location /health {
            proxy_pass http://rheo_backend;
            proxy_http_version 1.1;
        }

        # API & WebSocket (Socket.IO) Proxy
        location / {
            proxy_pass http://rheo_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived WebSocket connection timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;

            # Disable proxy buffering for instant binary chunk streaming
            proxy_buffering off;
        }
    }
}
