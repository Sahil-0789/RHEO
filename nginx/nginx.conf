# ─────────────────────────────────────────────────────────────────
# Nginx Configuration — DropShare
#
# In production: AWS ALB handles TLS termination (HTTPS → HTTP).
# Nginx then proxies HTTP + WebSocket connections to Node.js.
#
# WebSocket connections require the HTTP Upgrade mechanism:
#   Client → HTTP/1.1 GET with:
#     Connection: Upgrade
#     Upgrade: websocket
#   Nginx forwards these headers so Node.js/Socket.IO can complete
#   the 101 Switching Protocols handshake and establish a persistent
#   bidirectional TCP connection.
# ─────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Map the Connection header for WebSocket upgrade support.
    # Without this, proxied WebSocket connections would fail.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream dropshare_backend {
        # In production this would list multiple EC2 instances or
        # be replaced by the ALB DNS name. Locally it's one server.
        server server:5000;

        # Keep upstream connections alive to reduce TCP handshake overhead
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Large file support — client_max_body_size applies to HTTP POST bodies.
        # Our file data travels over WebSocket (not HTTP POST), so this mainly
        # protects REST endpoints from oversized payloads.
        client_max_body_size 10M;

        # ── Health check passthrough ──────────────────────────────
        location /health {
            proxy_pass http://dropshare_backend;
            proxy_http_version 1.1;
        }

        # ── API and WebSocket (Socket.IO) ─────────────────────────
        location / {
            proxy_pass http://dropshare_backend;
            proxy_http_version 1.1;

            # Critical for WebSocket: forward upgrade headers.
            # Without Upgrade: websocket, Nginx will close the connection
            # and the client will fall back to HTTP polling.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket connections are long-lived (hours for large transfers).
            # Nginx's default proxy_read_timeout is 60s — increase it.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            # Disable buffering so chunks flow through immediately.
            # Buffering would add unnecessary latency to streaming data.
            proxy_buffering off;
        }
    }
}
