# ─────────────────────────────────────────────────────────────────
# RHEO — Production Docker Compose (AWS EC2 + Neon DB)
#
# Runs: Node.js app + Redis + Nginx Reverse Proxy (SSL)
# Database: Neon DB Managed Cloud PostgreSQL (DATABASE_URL in .env)
# ─────────────────────────────────────────────────────────────────

services:

  # ── Redis Cache & Socket Adapter ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rheo_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Node.js Backend Server ────────────────────────────────────
  server:
    image: rheo-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rheo_server
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-rheo_production_jwt_super_secret_key_2026}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-https://rheo.vercel.app}
      CHUNK_SIZE_BYTES: 1048576
      MAX_FILE_SIZE_BYTES: 5368709120
      MAX_IN_FLIGHT_CHUNKS: 8
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Nginx Reverse Proxy (SSL & WebSocket Upgrade) ─────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: rheo_nginx
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot

volumes:
  redisdata_prod:
  certbot_webroot:
