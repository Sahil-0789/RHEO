name: RHEO Production CI/CD Pipeline

on:
  push:
    branches:
      - v1
      - main

jobs:
  # ── Job 1: Build & Verify ──────────────────────────────────────
  verify:
    name: Verify & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Install Client Dependencies & Test Build
        run: |
          cd client
          npm ci
          npm run build

  # ── Job 2: Deploy Backend to AWS EC2 ───────────────────────────
  deploy-backend:
    name: Deploy Backend to AWS EC2
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET
          script: |
            set -e
            cd /home/ubuntu/Rheo || cd ~/Rheo || cd ~/RHEO_
            sudo mkdir -p /etc/letsencrypt /var/www/certbot || true
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            if [ -n "$DATABASE_URL" ]; then
              echo "DATABASE_URL=\"$DATABASE_URL\"" > .env
              echo "REDIS_URL=\"redis://redis:6379\"" >> .env
              echo "NODE_ENV=\"production\"" >> .env
              echo "PORT=5000" >> .env
            fi
            docker-compose -f docker-compose.prod.yml down --remove-orphans || true
            docker-compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
